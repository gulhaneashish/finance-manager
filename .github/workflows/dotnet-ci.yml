
name: FinanceManager .NET CI and ECR

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: finance-manager-api
  EC2_INSTANCE_ID: i-0895aaa5413365f23

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore API dependencies
        run: dotnet restore FinanceManager.API.csproj
        working-directory: backend/FinanceManager.API/FinanceManager.API

      - name: Build API
        run: dotnet build FinanceManager.API.csproj --configuration Release --no-restore
        working-directory: backend/FinanceManager.API/FinanceManager.API

      - name: Run automated tests
        run: dotnet test backend/FinanceManager.API/FinanceManager.Tests/FinanceManager.Tests.csproj --configuration Release

      - name: Configure AWS credentials using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: backend/FinanceManager.API/FinanceManager.API
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to EC2 through SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          INSTANCE_ID: ${{ env.EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          # This script runs on EC2 through AWS Systems Manager.
          # The GitHub SHA is used as the immutable deployment tag.
          DEPLOY_SCRIPT=$(cat <<REMOTE_SCRIPT
          set -Eeuo pipefail

          REGION='${{ env.AWS_REGION }}'
          IMAGE_URI='${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          REGISTRY='${{ steps.login-ecr.outputs.registry }}'
          OLD='finance-manager-api-v1'
          BACKUP='finance-manager-api-rollback'
          NEW='finance-manager-api-v1'
          PORT='http://127.0.0.1:8081/health'
          ROLLBACK_STARTED=0

          rollback() {
            rc=\$?
            trap - ERR
            set +e

            echo "Deployment failed. Attempting rollback."

            if [ "\$ROLLBACK_STARTED" -eq 1 ]; then
              docker rm -f "\$NEW" >/dev/null 2>&1 || true

              if docker inspect "\$OLD" >/dev/null 2>&1; then
                docker rm -f "\$OLD" >/dev/null 2>&1 || true
              fi

              if docker inspect "\$BACKUP" >/dev/null 2>&1; then
                if ! docker rename "\$BACKUP" "\$OLD"; then
                  echo "CRITICAL: Could not rename rollback container."
                  exit 2
                fi
              fi
            fi

            if docker inspect "\$OLD" >/dev/null 2>&1; then
              if ! docker start "\$OLD"; then
                echo "CRITICAL: Could not start the previous container."
                exit 2
              fi

              for i in \$(seq 1 18); do
                if curl -fsS "\$PORT" >/dev/null; then
                  echo "Rollback health check passed."
                  exit "\$rc"
                fi
                sleep 5
              done

              echo "CRITICAL: Previous container did not become healthy."
              exit 2
            fi

            echo "CRITICAL: No previous container is available to restore."
            exit 2
          }

          echo "Authenticating to Amazon ECR."
          aws ecr get-login-password --region "\$REGION" |
            docker login --username AWS --password-stdin "\$REGISTRY"

          echo "Pulling image: \$IMAGE_URI"
          docker pull "\$IMAGE_URI"

          echo "Checking current API before deployment."
          if ! curl -fsS "\$PORT" >/dev/null; then
            echo "Current API is unhealthy. Refusing deployment."
            exit 1
          fi

          # Remove the older backup only after confirming that the
          # currently running API is healthy.
          if docker inspect "\$BACKUP" >/dev/null 2>&1; then
            echo "Removing the older stopped rollback container."
            docker rm "\$BACKUP"
          fi

          # From this point, automatically attempt recovery on errors.
          trap rollback ERR

          echo "Stopping the current API."
          docker stop "\$OLD"

          echo "Retaining the current container as rollback."
          docker rename "\$OLD" "\$BACKUP"
          ROLLBACK_STARTED=1

          echo "Starting the new API image."
          docker run -d \
            --name "\$NEW" \
            --restart unless-stopped \
            --env-file /etc/finance-manager/finance-manager.env \
            -p 127.0.0.1:8081:8080 \
            "\$IMAGE_URI"

          echo "Waiting for the new API health check."
          OK=0

          for i in \$(seq 1 18); do
            if [ "\$(docker inspect -f '{{.State.Running}}' "\$NEW" 2>/dev/null || true)" = "true" ] &&
               curl -fsS "\$PORT" >/dev/null; then
              OK=1
              break
            fi
            sleep 5
          done

          if [ "\$OK" -ne 1 ]; then
            echo "New API failed its health check."
            docker logs --tail 50 "\$NEW" || true
            false
          fi

          echo "New API is healthy."
          trap - ERR

          echo "Deployment succeeded."
          echo "Previous container retained as \$BACKUP."
          REMOTE_SCRIPT
          )

          # Encode the remote script as one SSM shell command.
          jq -n \
            --arg instance "$INSTANCE_ID" \
            --arg script "$DEPLOY_SCRIPT" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance],
              Parameters: {
                commands: [$script]
              },
              TimeoutSeconds: 600
            }' > deploy-request.json

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://deploy-request.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM. Check the invocation status before retrying."
          exit 1
