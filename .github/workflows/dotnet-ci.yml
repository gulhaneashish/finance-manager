
name: FinanceManager .NET CI and ECR

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: finance-manager-api

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore API dependencies
        run: dotnet restore FinanceManager.API.csproj
        working-directory: backend/FinanceManager.API/FinanceManager.API

      - name: Build API
        run: dotnet build FinanceManager.API.csproj --configuration Release --no-restore
        working-directory: backend/FinanceManager.API/FinanceManager.API

      - name: Run automated tests
        run: dotnet test backend/FinanceManager.API/FinanceManager.Tests/FinanceManager.Tests.csproj --configuration Release

      - name: Configure AWS credentials using OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: backend/FinanceManager.API/FinanceManager.API
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
      
      - name: Deploy to EC2 through SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          AWS_DEFAULT_REGION: ap-south-1
          INSTANCE_ID: i-0895aaa5413365f23
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/finance-manager-api:${{ github.sha }}
        run: |
          cat > deploy-request.json <<'JSON'
          {
            "DocumentName": "AWS-RunShellScript",
            "InstanceIds": ["i-0895aaa5413365f23"],
            "Parameters": {
              "commands": [
                "set -eu",
                "IMAGE_URI='${{ steps.login-ecr.outputs.registry }}/finance-manager-api:${{ github.sha }}'",
                "REGION='ap-south-1'",
                "OLD='finance-manager-api-v1'",
                "BACKUP='finance-manager-api-rollback'",
                "NEW='finance-manager-api-v1'",
                "docker pull \"$IMAGE_URI\"",
                "if docker inspect \"$BACKUP\" >/dev/null 2>&1; then echo 'Rollback container already exists; refusing to overwrite it'; exit 1; fi",
                "docker stop \"$OLD\"",
                "docker rename \"$OLD\" \"$BACKUP\"",
                "if ! docker run -d --name \"$NEW\" --restart unless-stopped --env-file /etc/finance-manager/finance-manager.env -p 127.0.0.1:8081:8080 \"$IMAGE_URI\"; then docker rename \"$BACKUP\" \"$OLD\"; docker start \"$OLD\"; exit 1; fi",
                "OK=0",
                "for i in $(seq 1 18); do if [ \"$(docker inspect -f '{{.State.Running}}' \"$NEW\" 2>/dev/null || true)\" = true ] && curl -fsS http://127.0.0.1:8081/health >/dev/null; then OK=1; break; fi; sleep 5; done",
                "if [ \"$OK\" -ne 1 ]; then docker logs --tail 50 \"$NEW\" || true; docker rm -f \"$NEW\" || true; docker rename \"$BACKUP\" \"$OLD\"; docker start \"$OLD\"; exit 1; fi",
                "echo 'Deployment health check passed. Previous container retained for rollback.'"
              ]
            },
            "TimeoutSeconds": 600
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://deploy-request.json \
            --query 'Command.CommandId' --output text)

          echo "SSM command: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM command."
          exit 1
