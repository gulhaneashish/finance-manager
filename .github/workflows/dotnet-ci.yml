
name: FinanceManager .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FinanceManager.API.csproj
        working-directory: backend/FinanceManager.API/FinanceManager.API

      - name: Build application
        run: dotnet build FinanceManager.API.csproj --configuration Release --no-restore
        working-directory: backend/FinanceManager.API/FinanceManager.API
