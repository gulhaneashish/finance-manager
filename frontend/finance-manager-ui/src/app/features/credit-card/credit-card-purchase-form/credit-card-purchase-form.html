<div class="purchase-form">

  <div class="form-header">

    <div>
      <h2>Credit Card Purchase</h2>

      <p>
        Record a new credit card purchase.
      </p>
    </div>

    <!-- <button
      type="button"
      class="close-button"
      (click)="close()">

      ✕

    </button> -->

  </div>


  @if (error$ | async; as error) {

    <div class="error-message">
      {{ error }}
    </div>

  }


  @if (successMessage$ | async; as message) {

    <div class="success-message">
      {{ message }}
    </div>

  }


  <div class="form-group">

    <label for="category">
      Expense Category
    </label>

    <select
      id="category"
      [(ngModel)]="categoryId">

      <option [ngValue]="null">
        Select Category
      </option>

      @if (categories$ | async; as categories) {

        @for (
          category of categories;
          track category.id
        ) {

          @if (category.type === 'EXPENSE') {

            <option
              [ngValue]="category.id">

              {{ category.name }}

            </option>

          }

        }

      }

    </select>

  </div>


  <div class="form-group">

    <label for="amount">
      Amount
    </label>

    <input
      id="amount"
      type="number"
      min="0.01"
      step="0.01"
      [(ngModel)]="amount"
      placeholder="Enter purchase amount">

  </div>


  <div class="form-group">

    <label for="description">
      Description
    </label>

    <input
      id="description"
      type="text"
      maxlength="250"
      [(ngModel)]="description"
      placeholder="Example: Grocery shopping">

  </div>


  <div class="form-group">

    <label for="transactionDate">
      Purchase Date
    </label>

    <input
      id="transactionDate"
      type="date"
      [(ngModel)]="transactionDate">

  </div>


  <div class="form-actions">

    <button
      type="button"
      class="cancel-button"
      (click)="close()">

      Cancel

    </button>


    <button
      type="button"
      class="submit-button"
      [disabled]="loading$ | async"
      (click)="submit()">

      @if (loading$ | async) {
        Processing...
      } @else {
        Make Purchase
      }

    </button>

  </div>

</div>
