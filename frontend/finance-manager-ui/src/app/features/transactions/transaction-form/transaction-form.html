<div class="transaction-form-body">
  <form [formGroup]="transactionForm" (ngSubmit)="submit()">
    <!-- Account Selection -->
    <div class="form-field full-width">
      <label for="account">
        Select Account <span class="required">*</span>
      </label>
      <select id="account" formControlName="accountId">
        <option [ngValue]="0">-- Select an account --</option>
        @for (account of transactionAccounts$ | async; track account.id) {
          <option [ngValue]="account.id">
            {{ account.name }} (₹{{ account.currentBalance | number:'1.0-2' }})
          </option>
        }
      </select>
      @if (transactionForm.get('accountId')?.touched && transactionForm.get('accountId')?.invalid) {
        <small class="error-text">Please choose an active account.</small>
      }
    </div>

    <!-- Type -->
    <div class="form-field">
      <label for="type">
        Type <span class="required">*</span>
      </label>
      <select id="type" formControlName="type">
        <option [ngValue]="TransactionType.Expense">🛒 Expense</option>
        <option [ngValue]="TransactionType.Income">💰 Income</option>
      </select>
    </div>

    <!-- Amount -->
    <div class="form-field">
      <label for="amount">
        Amount (₹) <span class="required">*</span>
      </label>
      <input
        id="amount"
        type="number"
        formControlName="amount"
        min="0.01"
        step="0.01"
        placeholder="0.00"
      />
      @if (transactionForm.get('amount')?.touched && transactionForm.get('amount')?.invalid) {
        <small class="error-text">Amount must be greater than zero.</small>
      }
    </div>

    <!-- Category -->
    <div class="form-field">
      <label for="category">Category</label>
      <select id="category" formControlName="categoryId">
        <option [ngValue]="null">-- Select Category --</option>
        @for (category of categories$ | async; track category.id) {
          <option [ngValue]="category.id">
            {{ category.name }}
          </option>
        }
      </select>
    </div>

    <!-- Transaction Date -->
    <div class="form-field">
      <label for="transactionDate">
        Date <span class="required">*</span>
      </label>
      <input
        id="transactionDate"
        type="date"
        formControlName="transactionDate"
      />
    </div>

    <!-- Description -->
    <div class="form-field full-width">
      <label for="description">Description (Optional)</label>
      <input
        id="description"
        type="text"
        formControlName="description"
        maxlength="250"
        placeholder="e.g. Grocery shopping, Client payment"
      />
    </div>

    <!-- Actions Footer -->
    <div class="dialog-actions-footer">
      <button type="button" class="btn-cancel" (click)="cancel()">
        Cancel
      </button>
      <button
        type="submit"
        class="btn-submit"
        [disabled]="transactionForm.invalid"
      >
        Add Transaction
      </button>
    </div>
  </form>
</div>
